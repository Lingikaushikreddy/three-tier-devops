# Three tiers, three containers, one command to start them all.
#
#   internet ──► web (nginx) ──► api (flask) ──► db (postgres)
#                  :8080           internal        internal
#
# Only the web tier publishes a port. The API and the database are reachable
# only from inside the private Docker network — that is the whole point.

services:
  # ---------- Tier 3: data ----------
  db:
    image: postgres:16-alpine
    container_name: tt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    volumes:
      # Named volume: the data survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
      # Anything in this folder runs once, on first creation of the volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    # NOTE: no `ports:` on purpose. The database must not be reachable from
    # your laptop or the internet. To poke at it, go through the container:
    #   docker compose exec db psql -U postgres -d tasks

  # ---------- Tier 2: application ----------
  api:
    build:
      context: ./api
    container_name: tt-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tasks}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      db:
        # Wait for the database to be genuinely ready, not merely started.
        # Without `condition: service_healthy` the API boots first and crashes.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backend, frontend]
    # Also no published port. nginx reaches it over the `frontend` network.

  # ---------- Tier 1: web / reverse proxy ----------
  web:
    image: nginx:1.27-alpine
    container_name: tt-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [frontend]

networks:
  # Two networks so the web tier physically cannot reach the database.
  # Network segmentation, the same idea as a DMZ.
  frontend:
  backend:

volumes:
  pgdata:
