name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Fast feedback: pure logic, no containers ----------
  unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -v

  # ---------- Slow feedback: the real three-tier stack ----------
  integration:
    name: Integration (full stack + monitoring)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Create the .env file from the example
        # Real secrets would come from GitHub Secrets. These are throwaway
        # values for a container that lives for ninety seconds.
        run: cp .env.example .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Show what is running
        run: docker compose ps

      - name: Run the integration smoke test
        run: ./scripts/smoke.sh

      # Break the database on purpose and assert the system degrades honestly,
      # keeps publishing metrics, and fires the alert. Monitoring you have
      # never watched fire is only a guess that it works.
      - name: Failure drill (chaos test)
        run: ./scripts/chaos.sh

      - name: Show fired alerts for the record
        if: always()
        run: |
          curl -fsS http://127.0.0.1:9090/api/v1/rules \
            | python3 -c 'import json,sys; [print(f"{r[\"name\"]:<24} {r.get(\"state\",\"?\")}") for g in json.load(sys.stdin)["data"]["groups"] for r in g["rules"]]'

      - name: Dump logs if anything failed
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear everything down
        if: always()
        run: docker compose down -v
