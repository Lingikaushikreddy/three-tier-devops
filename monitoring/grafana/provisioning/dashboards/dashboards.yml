apiVersion: 1

providers:
  - name: three-tier
    orgId: 1
    folder: Three-Tier Stack
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true # you can tweak in the UI, but the file is the source of truth
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
