# Tier 1: the web/proxy tier. Nothing from outside talks to the API directly.

upstream api_backend {
    # "api" is not a hostname you configured anywhere — Docker's internal DNS
    # resolves it to the api container automatically, because that is the
    # service name in docker-compose.yml.
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Don't advertise the exact nginx version to attackers.
    server_tokens off;

    # nginx's own liveness check — answered without touching the API at all,
    # so it tells you "the proxy is up" independently of the backend.
    location = /nginx-health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","tier":"nginx"}';
    }

    # The static front end.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api/ and /health goes to the application tier.
    location ~ ^/(api|health) {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Without these the app only ever sees nginx's IP, and every log line
        # and rate limit becomes useless.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
